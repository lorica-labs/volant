# A test that hangs must end as a failure, not as a job that runs until the CI timeout. The
# ssh tests talk to a real sshd and a stuck connection there has no deadline of its own.
#
# The module goldens (`reference_modules`) need the recorded ansible-core, sudo, systemd, apt and
# cron: they run in the `ssh` job and in `just test-reference`, not on every local check.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 10 }
default-filter = "not binary(reference_modules)"
