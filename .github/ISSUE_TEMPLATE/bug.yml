name: Bug report
description: Something does not work as documented
labels: ["type/bug", "status/needs-triage"]
body:
  - type: input
    id: version
    attributes:
      label: Volant version
      description: Output of `volant --version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Controller and target operating systems
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal playbook and inventory help a lot
      render: yaml
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the full output, with `-vvv` if possible
    validations:
      required: true
