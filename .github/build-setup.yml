# Steps dist inserts into every build-local-artifacts job of release.yml, before `dist build`
# (github-build-setup in dist-workspace.toml). They build the three agents the controller embeds
# for the job's target and name their directory in VOLANT_EMBED_AGENTS_DIR, which
# crates/volant/build.rs reads. The musl agents are built with zig, the one toolchain that links
# them from every runner, macOS included. The local agent of a Linux job is its own musl agent.
# A separate target directory keeps these builds apart from the one dist makes next.
- name: Install zig
  uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
  with:
    version: 0.15.2
    use-cache: false
- name: Install cargo-zigbuild
  uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2
  with:
    tool: cargo-zigbuild@0.23.4
- name: Build the agents the controller embeds
  shell: bash
  env:
    TARGET: ${{ join(matrix.targets, '') }}
  run: |
    set -euo pipefail
    agents="$RUNNER_TEMP/embed-agents"
    export CARGO_TARGET_DIR="$RUNNER_TEMP/embed-agents-target"
    mkdir -p "$agents"
    for musl in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
      cargo zigbuild --locked -p volant-agent --profile dist --target "$musl"
      cp "$CARGO_TARGET_DIR/$musl/dist/volant-agent" "$agents/volant-agent-$musl"
    done
    case "$TARGET" in
      *-unknown-linux-musl)
        cp "$agents/volant-agent-$TARGET" "$agents/volant-agent"
        ;;
      *-unknown-linux-gnu)
        cp "$agents/volant-agent-${TARGET%%-*}-unknown-linux-musl" "$agents/volant-agent"
        ;;
      *)
        cargo build --locked -p volant-agent --profile dist --target "$TARGET"
        cp "$CARGO_TARGET_DIR/$TARGET/dist/volant-agent" "$agents/volant-agent"
        ;;
    esac
    file "$agents"/*
    # volant_echo is a native for the agent's own tests: a release agent must not carry it.
    if grep -alq volant_echo "$agents"/volant-agent*; then
      echo "a release agent carries the test-only native volant_echo"
      exit 1
    fi
    echo "VOLANT_EMBED_AGENTS_DIR=$agents" >> "$GITHUB_ENV"
- name: Pin the glibc floor of the glibc build
  shell: bash
  env:
    TARGET: ${{ join(matrix.targets, '') }}
  run: |
    set -euo pipefail
    case "$TARGET" in
      *-unknown-linux-gnu) ;;
      *) exit 0 ;;
    esac
    wrapper="$RUNNER_TEMP/cargo-glibc-floor"
    cat > "$wrapper" <<'EOF'
    #!/bin/sh
    # Build a glibc triple with cargo-zigbuild and put the glibc floor in the triple. Send every
    # other command to cargo. cargo-zigbuild reads CARGO too, so it must not see this file.
    unset CARGO
    [ "${1:-}" = build ] || exec cargo "$@"
    shift
    prev=
    for arg in "$@"; do
      shift
      case "$arg" in
        --target=*-unknown-linux-gnu) arg="$arg.$GLIBC_FLOOR" ;;
        *-unknown-linux-gnu) [ "$prev" = --target ] && arg="$arg.$GLIBC_FLOOR" ;;
      esac
      set -- "$@" "$arg"
      prev=$arg
    done
    exec cargo zigbuild "$@"
    EOF
    chmod +x "$wrapper"
    echo "CARGO=$wrapper" >> "$GITHUB_ENV"
    echo "GLIBC_FLOOR=2.17" >> "$GITHUB_ENV"
