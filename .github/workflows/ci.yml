name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A fix pass on a pull request replaces the run it supersedes; a push to main is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  # Whether the pull request changes anything but the hand-written documentation. When it does
  # not, the Rust jobs below are skipped, which the required checks accept, and the Documentation
  # workflow builds the site. The generated English pages stay out of that set: tests compare
  # them with the code.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The checkout is the merge commit: its first parent is the base branch.
          changed=$(git diff --name-only HEAD^1 HEAD)
          generated='^docs/src/content/docs/docs/(reference/(keywords|parity|modules)|hosts/connections)\.md$'
          if grep -Ev '^docs/' <<<"$changed" | grep -q . || grep -Eq "$generated" <<<"$changed"; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-deny,cargo-machete,typos,taplo,zizmor,just
      - run: cargo fmt --all --check
      - run: taplo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo doc --workspace --no-deps --document-private-items
      - run: cargo deny check
      - run: cargo machete
      - run: just ratchet
      - run: typos
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
      - run: zizmor .github/workflows

  # The steps are skipped, not the job: a skipped matrix job reports as `test`, never as
  # `test (ubuntu-latest)` or `test (macos-latest)`, the names the required checks wait for.
  test:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - if: needs.changes.outputs.code == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
      - if: needs.changes.outputs.code == 'true'
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: nextest
      # Includes `reference.rs`: the template, inventory and scenario goldens, which need no host.
      - if: needs.changes.outputs.code == 'true'
        run: cargo nextest run --workspace --no-tests=fail

  # A refactor or perf pull request changes no behaviour: no golden or snapshot moves, and the
  # list of tests is the one the merge base has, so a test is neither dropped nor renamed.
  refactor-guard:
    if: github.event_name == 'pull_request' && (startsWith(github.event.pull_request.title, 'refactor') || startsWith(github.event.pull_request.title, 'perf'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: nextest,just
      - name: No golden or snapshot changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff --exit-code "origin/${BASE_REF}...HEAD" -- crates/volant/tests/golden ':(glob)**/*.snap'
      - name: Same tests as the merge base
        env:
          BASE_REF: ${{ github.base_ref }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          just test-names > "$RUNNER_TEMP/head.txt"
          git worktree add "$RUNNER_TEMP/base" "$(git merge-base "origin/${BASE_REF}" HEAD)"
          (cd "$RUNNER_TEMP/base" && just test-names) > "$RUNNER_TEMP/base.txt"
          diff "$RUNNER_TEMP/base.txt" "$RUNNER_TEMP/head.txt"

  # Coverage is a figure to read on a pull request, not a gate on main: a push to main does not
  # run it, so a dip below the floor cannot leave main red.
  coverage:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: nextest,cargo-llvm-cov,just
      - run: just coverage
      # The report reuses the profile data `just coverage` left behind rather than running the
      # tests again.
      - run: just coverage-lcov
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # A pull request from a fork has no access to the token, and coverage upload is not a
          # reason to fail it: the floor above is the gate.
          fail_ci_if_error: false

  musl:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          target: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - run: cargo build --workspace --target x86_64-unknown-linux-musl

  msrv:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.95"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: "1.99"
      - run: cargo check --workspace --all-targets

  publish-dry-run:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
      - run: cargo publish --dry-run --workspace

  # The controller as a release builds it: static, with the agent inside.
  runtime-binary:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          target: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build the static controller with the agent embedded
        run: |
          set -euo pipefail
          cargo build -p volant-agent --release --target x86_64-unknown-linux-musl
          agents="$PWD/target/embed-agents"
          mkdir -p "$agents" dist
          agent=target/x86_64-unknown-linux-musl/release/volant-agent
          cp "$agent" "$agents/volant-agent"
          cp "$agent" "$agents/volant-agent-x86_64-unknown-linux-musl"
          # The build embeds an agent for each arch; this copy under the aarch64 name is a placeholder that never runs, since the playbook below only targets this machine.
          cp "$agent" "$agents/volant-agent-aarch64-unknown-linux-musl"
          VOLANT_EMBED_AGENTS_DIR="$agents" cargo build -p volant --release --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/volant dist/
          cp -r tests/runtime-clean dist/
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: just
      - name: The controller and the agent are static
        run: just link-check x86_64-unknown-linux-musl=dist/volant x86_64-unknown-linux-musl=target/x86_64-unknown-linux-musl/release/volant-agent
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: runtime-clean
          path: dist
          retention-days: 1

  # A machine with no Python and no ansible: the first playbook that needs the helper installs
  # Volant's runtime, the second installs nothing.
  runtime-clean:
    needs: runtime-binary
    runs-on: ubuntu-latest
    container: debian:stable-slim@sha256:a717a33469731894e77e912ea7d714e27c2dc38ee6554fd1a3102e92999cfc66
    steps:
      - name: Install curl, the only tool the download needs
        run: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: runtime-clean
          path: dist
      - name: The machine has no Python and no ansible
        run: |
          ! command -v python3 && ! command -v python && ! command -v ansible
      - name: First run installs the runtime
        working-directory: dist
        run: |
          set -euo pipefail
          chmod +x volant
          ./volant playbook -i runtime-clean/inventory.yml runtime-clean/site.yml 2> first.err
          cat first.err
          grep -q "^Installing Volant's Python runtime" first.err
      - name: Second run installs nothing
        working-directory: dist
        run: |
          set -euo pipefail
          ./volant playbook -i runtime-clean/inventory.yml runtime-clean/site.yml 2> second.err
          cat second.err
          ! grep -q "Installing Volant's Python runtime" second.err
      - name: A collection filter after installing its collection
        working-directory: dist
        run: |
          set -euo pipefail
          # Galaxy first. When its downloads fail, the same install takes the collection and the
          # one it depends on from their release tags: `--collections` hands each argument to
          # `ansible-galaxy collection install`, which reads `git+<url>,<tag>`.
          if ! ./volant runtime install --collections community.general; then
            echo "::warning::Galaxy failed; installing community.general from its release tag"
            apt-get install -y --no-install-recommends git
            ./volant runtime install --collections \
              git+https://github.com/ansible-collections/community.general.git,13.4.0 \
              git+https://github.com/ansible-collections/community.library_inventory_filtering.git,1.1.5
          fi
          ./volant playbook -i runtime-clean/inventory.yml runtime-clean/collection.yml

  # The static controller in an image built FROM scratch: no libc, no shell, no /etc/passwd.
  scratch:
    needs: runtime-binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: just
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: runtime-clean
          path: dist
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends busybox-static
      - run: just scratch-test dist/volant

  # The glibc controller as a release builds it: cargo-zigbuild, with the glibc floor of the
  # release in the target. aarch64 is built here too and checked on its ELF tables.
  glibc-floor:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-latest
    env:
      # zig prints a linker warning, and the denial of warnings would turn it into an error.
      RUSTFLAGS: ""
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          target: ${{ matrix.arch }}-unknown-linux-gnu
          rustflags: ""
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          use-cache: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-zigbuild@0.23.4,just
      - name: Build the controller against glibc 2.17
        env:
          TARGET: ${{ matrix.arch }}-unknown-linux-gnu
          # The setup action sets CARGO_BUILD_WARNINGS to deny for every later step.
          CARGO_BUILD_WARNINGS: warn
        run: cargo zigbuild --locked -p volant --release --target "$TARGET.2.17"
      - name: The controller needs no glibc symbol above the floor
        env:
          TARGET: ${{ matrix.arch }}-unknown-linux-gnu
        run: just link-check "$TARGET=target/$TARGET/release/volant" "$TARGET=target/$TARGET/release/volant-playbook"

  ssh:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          target: x86_64-unknown-linux-musl
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: nextest,just
      - name: Start an sshd that accepts a throwaway key
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools openssh-server
          sudo ssh-keygen -A
          sudo mkdir -p /run/sshd
          # A log, because sshd exits 0 even when it cannot bind the port; the smoke test below
          # is the real guard, but a bind failure is otherwise legible only by reproducing it.
          sudo /usr/sbin/sshd -E /tmp/sshd.log
          # sshd reads authorized_keys under the home directory in the passwd database, which
          # is not always the one $HOME names.
          home="$(getent passwd "$(id -un)" | cut -d: -f6)"
          mkdir -p "$home/.ssh"
          chmod 700 "$home/.ssh"
          ssh-keygen -q -t ed25519 -N "" -f "$home/.ssh/volant_test_key"
          cat "$home/.ssh/volant_test_key.pub" >> "$home/.ssh/authorized_keys"
          chmod 600 "$home/.ssh/authorized_keys"
          ssh -i "$home/.ssh/volant_test_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new localhost true
          echo "VOLANT_SSH_TEST_KEY=$home/.ssh/volant_test_key" >> "$GITHUB_ENV"
      - name: Show the sshd log
        if: failure()
        run: sudo cat /tmp/sshd.log
      - name: Install the controller Python
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install ansible-core==2.19.12
          echo "VOLANT_PYTHON=$PWD/.venv/bin/python" >> "$GITHUB_ENV"
      - name: Install the pinned collections
        run: |
          set -euo pipefail
          .venv/bin/python -m pip install netaddr==1.3.0 jmespath==1.1.0
          # Galaxy first. When its downloads fail, the same versions are built from their release tags.
          if ! .venv/bin/ansible-galaxy collection install -p "$PWD/.collections" \
            ansible.posix==2.2.2 community.general==13.4.0 ansible.utils==6.1.1 \
            community.library_inventory_filtering_v1==1.1.5; then
            echo "::warning::Galaxy failed; installing the pinned collections from their release tags"
            .venv/bin/ansible-galaxy collection install --force --no-deps -p "$PWD/.collections" \
              git+https://github.com/ansible-collections/ansible.posix.git,2.2.2 \
              git+https://github.com/ansible-collections/community.general.git,13.4.0 \
              git+https://github.com/ansible-collections/ansible.utils.git,v6.1.1 \
              git+https://github.com/ansible-collections/community.library_inventory_filtering.git,1.1.5
          fi
          echo "ANSIBLE_COLLECTIONS_PATH=$PWD/.collections" >> "$GITHUB_ENV"
      - name: Check the host and controller Pythons are distinct
        run: |
          set -euo pipefail
          echo "controller: $VOLANT_PYTHON"
          echo "host:       /usr/bin/python3"
          test "$(command -v python3)" = "/usr/bin/python3"
          test "$VOLANT_PYTHON" != "/usr/bin/python3"
          "$VOLANT_PYTHON" -c 'import ansible; print("controller ansible-core", ansible.__version__)'
          /usr/bin/python3 -c 'import sys; print("host python", sys.version.split()[0])'
          if /usr/bin/python3 -c 'import ansible' 2>/dev/null; then
            echo "/usr/bin/python3 has ansible-core; the ssh job cannot prove the module_utils came from the blob" >&2
            exit 1
          fi
          echo "host python has no ansible-core, as required"
      - run: just ssh-test
        env:
          # The native module tests create an account, a group and a unit on the machine they
          # run on. This runner is thrown away with the job, so they may use its localhost.
          VOLANT_NATIVE_TESTS_ON_LOCALHOST: "1"
