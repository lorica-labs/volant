name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: ${{ !env.ACT }}
      - name: Compile through sccache
        if: ${{ !env.ACT }}
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2
        with:
          tool: cargo-deny,cargo-machete,typos,taplo,zizmor
      - run: cargo fmt --all --check
      - run: taplo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo doc --workspace --no-deps --document-private-items
      - run: cargo deny check
      - run: cargo machete
      - run: typos
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
      - run: zizmor .github/workflows

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: ${{ !env.ACT }}
      - name: Compile through sccache
        if: ${{ !env.ACT }}
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2
        with:
          tool: nextest
      - run: cargo nextest run --workspace

  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          target: x86_64-unknown-linux-musl
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: ${{ !env.ACT }}
      - name: Compile through sccache
        if: ${{ !env.ACT }}
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - run: cargo build --workspace --target x86_64-unknown-linux-musl

  msrv:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.95"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: "1.95"
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: ${{ !env.ACT }}
      - name: Compile through sccache
        if: ${{ !env.ACT }}
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
      - run: cargo check --workspace --all-targets

  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: ${{ !env.ACT }}
      - name: Compile through sccache
        if: ${{ !env.ACT }}
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
      - run: cargo publish --dry-run --workspace

  ssh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          target: x86_64-unknown-linux-musl
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: ${{ !env.ACT }}
      - name: Compile through sccache
        if: ${{ !env.ACT }}
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2
        with:
          tool: nextest,just
      - name: Start an sshd that accepts a throwaway key
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools openssh-server
          sudo ssh-keygen -A
          sudo mkdir -p /run/sshd
          # A log, because sshd exits 0 even when it cannot bind the port; the smoke test below
          # is the real guard, but a bind failure is otherwise legible only by reproducing it.
          sudo /usr/sbin/sshd -E /tmp/sshd.log
          # sshd reads authorized_keys under the home directory in the passwd database, which
          # is not always the one $HOME names.
          home="$(getent passwd "$(id -un)" | cut -d: -f6)"
          mkdir -p "$home/.ssh"
          chmod 700 "$home/.ssh"
          ssh-keygen -q -t ed25519 -N "" -f "$home/.ssh/volant_test_key"
          cat "$home/.ssh/volant_test_key.pub" >> "$home/.ssh/authorized_keys"
          chmod 600 "$home/.ssh/authorized_keys"
          ssh -i "$home/.ssh/volant_test_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new localhost true
          echo "VOLANT_SSH_TEST_KEY=$home/.ssh/volant_test_key" >> "$GITHUB_ENV"
      - name: Show the sshd log
        if: failure()
        run: sudo cat /tmp/sshd.log
      - run: just ssh-test
