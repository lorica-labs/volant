name: CodeQL

# The analysis reads Rust, so a pull request that touches none is not worth two minutes of it.
# Pushes to main and the weekly scan stay unfiltered, so the analysed state of main is never partial.
# This workflow is deliberately absent from the required checks: a filtered required check never
# reports and would block every pull request it skips.
on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/codeql.yml"
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
