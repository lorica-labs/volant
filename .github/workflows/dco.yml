name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit carries a Signed-off-by trailer
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          missing=0
          for c in $(git rev-list "$BASE".."$HEAD"); do
            if git show -s --format=%B "$c" | grep -q '^Signed-off-by: '; then
              continue
            fi
            # release-plz writes the release commit through the GitHub API, which cannot add a
            # trailer. That commit is authored by a maintainer and only touches versions and the
            # changelog, so it is exempt.
            if [ "$(git show -s --format=%ce "$c")" = "noreply@github.com" ]; then
              case "$(git show -s --format=%s "$c")" in
                "chore: release v"* | "chore("*"): release v"*) continue ;;
              esac
            fi
            echo "missing sign-off: $c"
            missing=1
          done
          exit $missing
