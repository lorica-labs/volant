name: Conventional PR title

# The title check needs to read pull requests opened from forks. It checks out no
# code and holds no write permission, so the usual pull_request_target risk does not apply.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        with:
          types: |
            feat
            fix
            docs
            ci
            refactor
            test
            chore
            perf
            build
          requireScope: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
