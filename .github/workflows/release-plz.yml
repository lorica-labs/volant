name: Release-plz

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    if: github.repository_owner == 'lorica-labs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release-pr:
    if: github.repository_owner == 'lorica-labs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
      - uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5
        id: release-plz
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      # release-plz bumps the Cargo manifests only, and a test requires the volant.compat collection
      # to carry the engine version, so the release branch gets the collection version in a second
      # commit. The Actions bot authors it: release-plz counts any other author on its branch as a
      # contributor, and closes the pull request on the next run instead of updating it.
      - name: Set the volant.compat version on the release branch
        if: steps.release-plz.outputs.prs_created == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          PR: ${{ steps.release-plz.outputs.pr }}
          REPOSITORY: ${{ github.repository }}
        run: |
          branch=$(jq -er .head_branch <<<"$PR")
          version=$(jq -er '.releases[] | select(.package_name == "volant") | .version' <<<"$PR")
          git fetch --quiet origin "refs/heads/$branch"
          git switch --quiet --detach FETCH_HEAD
          galaxy=collections/ansible_collections/volant/compat/galaxy.yml
          sed -i "s/^version: .*/version: $version/" "$galaxy"
          if git diff --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898283+github-actions[bot]@users.noreply.github.com' \
            commit --quiet --signoff -m "chore: set the volant.compat version to $version" "$galaxy"
          git push --quiet "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git" \
            "HEAD:refs/heads/$branch"
