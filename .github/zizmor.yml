# release.yml is generated by dist and regenerated on every `dist init`, so hand edits are lost
# and would make `dist generate --check` fail. dist does not pin the actions it emits. Findings in
# that one file are ignored here; every hand-written workflow is audited normally.
rules:
  excessive-permissions:
    ignore:
      - release.yml
  template-injection:
    ignore:
      - release.yml
  unpinned-images:
    ignore:
      - release.yml
  unpinned-uses:
    ignore:
      - release.yml
