[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-alpha.8"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/lorica-labs/volant"
homepage = "https://volant.sh"
authors = ["Hugo Planque"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
assigning_clones = "warn"
default_trait_access = "warn"
format_collect = "warn"
format_push_string = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
match_bool = "warn"
match_same_arms = "warn"
needless_continue = "warn"
needless_raw_string_hashes = "warn"
redundant_closure_for_method_calls = "warn"
ref_option = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
trivially_copy_pass_by_ref = "warn"
too_many_lines = "warn"
unnested_or_patterns = "warn"

[workspace.dependencies]
anstream = "1"
anstyle = "1"
aes = "0.8"
anyhow = "1"
blake3 = "1.8"
clap = { version = "4", features = ["derive"] }
ctr = "0.9"
hmac = "0.12"
indexmap = "2"
insta = { version = "1", features = ["filters"] }
libc = "0.2"
miniz_oxide = "0.9.1"
minijinja = { version = "=3.0.1", features = [
  "preserve_order",
  "serde",
  "unstable_machinery",
] }
minijinja-contrib = { version = "=3.0.1", default-features = false, features = [
  "pycompat",
] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
regex = "1"
rstest = "0.27"
saphyr = "0.2.0"
saphyr-parser = "0.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = [
  "arbitrary_precision",
  "preserve_order",
  "unbounded_depth",
] }
sha1_smol = "1.0"
sha2 = "0.10"
shlex = "2"
tempfile = "3"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "io-util",
  "sync",
  "signal",
  "time",
] }
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
volant-protocol = { path = "crates/volant-protocol", version = "0.1.0-alpha.8" }

[profile.dev]
debug = "line-tables-only"

# The vault derives a key with 10000 PBKDF2 rounds on every decrypt; unoptimised, that is seconds
# per playbook run in the test profile.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.ctr]
opt-level = 3
[profile.dev.package.cipher]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
# No `panic = "abort"`: the agent turns a native module's panic into a failed task, which only
# an unwinding build can do. Measured on the musl agent: 6.6% larger, no speed difference.
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "fat"
