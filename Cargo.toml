[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/lorica-labs/volant"
homepage = "https://github.com/lorica-labs/volant"
authors = ["Hugo Planque"]

[workspace.dependencies]
anstream = "1"
anstyle = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
insta = { version = "1", features = ["filters"] }
libc = "0.2"
minijinja = "2"
regex = "1"
saphyr = "0.0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "io-util",
  "sync",
  "signal",
  "time",
] }
volant-protocol = { path = "crates/volant-protocol", version = "0.1.0-alpha.2" }

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "fat"
