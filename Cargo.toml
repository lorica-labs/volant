[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-alpha.13"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/lorica-labs/volant"
homepage = "https://volant.sh"
authors = ["Hugo Planque"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
assigning_clones = "warn"
default_trait_access = "warn"
format_collect = "warn"
format_push_string = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
match_bool = "warn"
match_same_arms = "warn"
needless_continue = "warn"
needless_raw_string_hashes = "warn"
redundant_closure_for_method_calls = "warn"
ref_option = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
trivially_copy_pass_by_ref = "warn"
too_many_lines = "warn"
unnested_or_patterns = "warn"

[workspace.dependencies]
mimalloc = { version = "0.1", default-features = false }
anstream = "1"
anstyle = "1"
aes = "0.9"
anyhow = "1"
blake3 = "1.8"
clap = { version = "4", features = ["derive"] }
ctr = "0.10"
# Decision record 0012: gzip over the miniz_oxide already in the tree.
flate2 = { version = "1.1", default-features = false, features = [
  "rust_backend",
] }
hmac = "0.13"
indexmap = "2"
insta = { version = "1", features = ["filters"] }
libc = "0.2"
miniz_oxide = "0.9.1"
minijinja = { version = "=3.0.4", features = [
  "preserve_order",
  "serde",
  "unstable_machinery",
] }
minijinja-contrib = { version = "=3.0.4", default-features = false, features = [
  "pycompat",
] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
regex = "1"
rstest = "0.28"
# The console's line editor: history and completion on a terminal, nothing else.
rustyline = { version = "19", default-features = false }
# Decision record 0012: TLS for galaxy, with ring and the system roots.
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
  "logging",
] }
rustls-native-certs = "0.8"
saphyr = "0.3.0"
saphyr-parser = "0.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = [
  "arbitrary_precision",
  "preserve_order",
  "unbounded_depth",
] }
sha1_smol = "1.0"
sha2 = "0.11"
shlex = "2"
# Decision record 0012: collection and role archives, read entry by entry.
tar = { version = "0.4", default-features = false }
# Decision record 0012: the galaxy HTTP client, blocking, without its bundled roots.
ureq = { version = "3.5", default-features = false, features = [
  "rustls-no-provider",
] }
tempfile = "3"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "io-util",
  "net",
  "sync",
  "signal",
  "time",
] }
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
volant-protocol = { path = "crates/volant-protocol", version = "0.1.0-alpha.13" }

[profile.dev]
debug = "line-tables-only"

# Every dependency optimised, the workspace's own crates not: a test spends most of its time in
# them (deflating the module union, hashing, the vault's 10000 PBKDF2 rounds, regex, YAML), and
# they are built once and then cached, while the crates being edited keep their fast rebuild.
# Measured on the whole suite with 8 threads: 2325 s of test time down to 1832 s.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1
# No `panic = "abort"`: the agent turns a native module's panic into a failed task, which only
# an unwinding build can do. Measured on the musl agent: 6.6% larger, no speed difference.
strip = true

# Release with symbols, for `just profile`: perf needs line tables and unstripped binaries.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "fat"
