[package]
name = "volant"
description = "Fast, drop-in engine for Ansible playbooks"
readme = "../../README.md"
keywords = ["ansible", "automation", "ssh", "config-management"]
categories = ["command-line-utilities"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
build = "build.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
shlex.workspace = true
volant-protocol.workspace = true
yaml-rust2.workspace = true

# Remove this entry once the controller actually uses volant-protocol.
[package.metadata.cargo-machete]
ignored = ["volant-protocol"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.xz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"
