[package]
name = "volant"
description = "Fast engine for Ansible playbooks, written in Rust"
readme = "../../README.md"
keywords = ["ansible", "automation", "ssh", "config-management"]
categories = ["command-line-utilities"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://volant.sh"
authors.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
anstream.workspace = true
anstyle.workspace = true
anyhow.workspace = true
blake3.workspace = true
clap.workspace = true
libc.workspace = true
minijinja.workspace = true
minijinja-contrib.workspace = true
regex.workspace = true
saphyr.workspace = true
serde_json.workspace = true
shlex.workspace = true
tokio.workspace = true
volant-protocol.workspace = true

[dev-dependencies]
insta.workspace = true

[[bin]]
name = "volant-playbook"
path = "src/bin/volant-playbook.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.xz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"
