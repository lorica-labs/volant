- name: cis
  source: {git: "https://github.com/ansible-lockdown/UBUNTU24-CIS", sha: 7f7c949f0ae1784e0e7687b3d68f2e8fcdf27b54}
  collections:
    - {name: community.general, version: 13.5.0}
    - {name: community.crypto, version: 3.5.1}
    - {name: ansible.posix, version: 2.2.2}
  playbook: repo:site.yml
  hosts: 1
  where: container
  vars:
    system_is_container: true
    ubtu24cis_disruption_high: false
    setup_audit: false
    run_audit: false
    ubtu24cis_config_aide: false
    # The corpus user logs in with a key and has a locked password; rule 5.2.4 refuses to run then.
    ubtu24cis_rule_5_2_4: false
  volatile: []
  generate: null
  skip_reason: https://github.com/lorica-labs/volant/issues/858
