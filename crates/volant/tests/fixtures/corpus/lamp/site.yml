# Apache and PHP with one virtual host. Port 8080, because nginx holds :80 on the VMs.
- hosts: corpus
  become: true
  vars:
    apache_listen_port: 8080
    apache_vhosts:
      - servername: corpus.example.test
        documentroot: /var/www/corpus
  pre_tasks:
    - name: Create the document root
      ansible.builtin.file:
        path: /var/www/corpus
        state: directory
        mode: "0755"
  roles:
    - geerlingguy.apache
    - geerlingguy.php
