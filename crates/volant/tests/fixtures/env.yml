- hosts: localhost
  gather_facts: false
  environment:
    PLAY_ENV: play
  tasks:
    - name: env on task
      shell: echo "$PLAY_ENV $TASK_ENV"
      environment:
        TASK_ENV: "{{ 'templated' }}"
      register: e
    - debug: var=e.stdout
    - name: env with non-string
      shell: echo "$N"
      environment: { N: 42 }
      register: n
    - debug: var=n.stdout
    - name: env not a dict
      shell: echo x
      environment: notadict
    - block:
        - name: env from the block
          shell: echo "$B"
          register: b
      environment: { B: blk }
    - name: a lookup is not the task's environment
      debug:
        msg: "{{ b.stdout }} {{ lookup('env', 'B') }}"
      environment: { B: dbg }
