- hosts: h1
  gather_facts: false
  tasks:
    - name: fail with a secret
      fail:
        msg: "the password is {{ password }}"
      no_log: true
      ignore_errors: true
    - name: a command fails with a secret
      command: "false {{ password }}"
      no_log: true
      ignore_errors: true
- hosts: gone
  gather_facts: false
  tasks:
    - name: unreachable with a secret
      command: "echo {{ password }}"
      no_log: true
