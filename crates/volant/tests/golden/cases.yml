# A merge key (`<<`) puts the merged pairs first and the explicit keys after them. An explicit key
# takes the value of a merged key and keeps its place; in a list, an earlier mapping beats a later one.
- template: "{{ d | to_json }}"
  vars: {base: &base {a: 1, b: 2}, d: {z: 0, <<: *base, b: 9}}
