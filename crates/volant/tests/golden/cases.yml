# Each case is either a template rendered through `debug: msg=` or a `when` condition.
# Regenerate expected.json with `just golden`; never edit expected.json by hand.
- template: "{{ 1 + 1 }}"
- template: "{{ 2.5 * 2 }}"
- template: "{{ x * 2 }}"
  vars: {x: 5}
- template: "Hello {{ name }}!"
  vars: {name: World}
- template: "{{ name }} and {{ other }}"
  vars: {name: a, other: b}
- template: "{{ items | length }}"
  vars: {items: [1, 2, 3]}
- template: "{{ items[1] }}"
  vars: {items: [1, 2, 3]}
- template: "{{ conf.port }}"
  vars: {conf: {port: 8080}}
- template: "{{ conf['port'] }}"
  vars: {conf: {port: 8080}}
- template: "{{ flag }}"
  vars: {flag: true}
- template: "{{ nothing }}"
  vars: {nothing: null}
- template: "{{ items }}"
  vars: {items: [1, "two", {three: 3}]}
- template: "{{ 'lit' }}"
- template: "{% if x %}yes{% else %}no{% endif %}"
  vars: {x: 0}
- template: "{{ missing }}"
- template: "{{ conf.missing }}"
  vars: {conf: {port: 1}}
- template: "{{ 'text' | upper }}"
- template: "{{ items | join(', ') }}"
  vars: {items: [a, b]}
- template: "{{ (x > 3) | string }}"
  vars: {x: 5}
- template: "plain text without a template"
- template: "{{ x }}"
  vars: {x: "007"}
- template: "{{ x | int }}"
  vars: {x: "007"}
- when: "x > 3"
  vars: {x: 5}
- when: "x > 3"
  vars: {x: 1}
- when: "flag"
  vars: {flag: false}
- when: "x is defined"
  vars: {x: 1}
- when: "y is defined"
- when: "y is not defined"
- when: "'yes'"
- when: "x"
  vars: {x: "false"}
- when: "{{ x > 3 }}"
  vars: {x: 5}
- when: "missing > 3"
# YAML 1.1 vs 1.2 scalar resolution: PyYAML (Ansible, and generate.py itself) follows 1.1,
# saphyr follows 1.2. These are single expressions so the JSON type PyYAML resolved survives
# unchanged into expected.json's "result": reading it after `just golden` tells us what
# ansible-core treats as bool/null/int/string for each spelling, ground truth for yaml.rs.
- template: "{{ flag }}"
  vars: {flag: yes}
- template: "{{ flag }}"
  vars: {flag: Yes}
- template: "{{ flag }}"
  vars: {flag: YES}
- template: "{{ flag }}"
  vars: {flag: no}
- template: "{{ flag }}"
  vars: {flag: No}
- template: "{{ flag }}"
  vars: {flag: NO}
- template: "{{ flag }}"
  vars: {flag: on}
- template: "{{ flag }}"
  vars: {flag: On}
- template: "{{ flag }}"
  vars: {flag: ON}
- template: "{{ flag }}"
  vars: {flag: off}
- template: "{{ flag }}"
  vars: {flag: Off}
- template: "{{ flag }}"
  vars: {flag: OFF}
- template: "{{ flag }}"
  vars: {flag: "yes"}
- template: "{{ flag }}"
  vars: {flag: "no"}
- template: "{{ flag }}"
  vars: {flag: "on"}
- template: "{{ flag }}"
  vars: {flag: "off"}
- template: "{{ nothing }}"
  vars: {nothing: ~}
- template: "{{ nothing }}"
  vars: {nothing: null}
- template: "{{ nothing }}"
  vars: {nothing: Null}
- template: "{{ nothing }}"
  vars: {nothing: NULL}
- template: "{{ nothing }}"
  vars: {nothing: "null"}
- template: "{{ num }}"
  vars: {num: 010}
- template: "{{ num }}"
  vars: {num: "010"}
- template: "{{ num }}"
  vars: {num: 08}
- template: "{{ num }}"
  vars: {num: 0x10}
- template: "{{ num }}"
  vars: {num: 1_000}
- template: "{{ num }}"
  vars: {num: 1.0}
- template: "{{ v }}"
  vars: {v: "true"}
- template: "{{ v }}"
  vars: {v: "false"}
- template: "{{ v }}"
  vars: {v: True}
- template: "{{ v }}"
  vars: {v: False}
# Aliases, tags and plain scalars as PyYAML reads them, through `from_yaml`, which loads its text
# with PyYAML's own loader. A date prints as `to_json` prints it: the value model has no date.
# `from_yaml` knows neither `!unsafe` nor `!vault`: the vars loader's rows are in the scenarios.
- {template: "{{ s | from_yaml }}", vars: {s: "a: &n 5\nb: *n"}}
- {template: "{{ s | from_yaml }}", vars: {s: "a: &n yes\nb: [*n, *n]"}}
- {template: "{{ s | from_yaml }}", vars: {s: "a: &k key\nm: {*k : 1}"}}
- {template: "{{ s | from_yaml }}", vars: {s: "a: &n 010\nb: *n"}}
- {template: "{{ s | from_yaml }}", vars: {s: "a: &n \"5\"\nb: *n"}}
- {template: "{{ s | from_yaml }}", vars: {s: "a: &n |\n  x\n  y\nb: *n"}}
- {template: "{{ s | from_yaml }}", vars: {s: "a: !!str 5"}}
- {template: "{{ s | from_yaml }}", vars: {s: "a: !!int \"5\""}}
- {template: "{{ s | from_yaml }}", vars: {s: "a: !!float 5"}}
- {template: "{{ s | from_yaml }}", vars: {s: "a: !!bool \"yes\""}}
- {template: "{{ s | from_yaml }}", vars: {s: "a: !!null x"}}
- {template: "{{ s | from_yaml }}", vars: {s: "a: [1:30, 190:20:30, 1:30.5]"}}
- {template: "{{ s | from_yaml }}", vars: {s: "a: [+.5, -.5, .5, 5., 1.e+3]"}}
- {template: "{{ s | from_yaml }}", vars: {s: "a: [010, 08, 0o10, 0x1F, 1_000, 1e3, 1.0e+3]"}}
- {template: "{{ s | from_yaml | to_json }}", vars: {s: "a: [2020-01-02, 2020-1-2, 2020-01-02 10:11:12, 2020-01-02T10:11:12Z, 2020-01-02t10:11:12.5+01:00]"}}
- {template: "{{ s | from_yaml }}", vars: {s: "a: !custom x"}}
- {template: "{{ s | from_yaml }}", vars: {s: "a: !!int abc"}}
