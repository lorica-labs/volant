- template: "{{ lookup('env', 'VOLANT_GOLDEN_UNSET_ENV') }}"
- template: "{{ lookup('vars', 'name') }}"
  vars: {name: found}
- template: "{{ lookup('pipe', 'echo piped') }}"
- template: "{{ lookup('file', 'golden_lookup.txt') }}"
# YAML 1.1 scalar resolution: PyYAML types these `vars` before any template runs, so the
# reference type of each spelling is what expected.json records.
- template: "{{ x }}"
  vars: {x: 010}
- template: "{{ x }}"
  vars: {x: 0o10}
- template: "{{ x }}"
  vars: {x: 0b1010}
- template: "{{ x }}"
  vars: {x: 1_000}
- template: "{{ x }}"
  vars: {x: 0x1F}
- template: "{{ x }}"
  vars: {x: 1e3}
- template: "{{ x }}"
  vars: {x: +12}
- template: "{{ x }}"
  vars: {x: 0}
- template: "{{ x }}"
  vars: {x: 00}
# The `bool` filter's own spellings, which are not PyYAML's
- template: "{{ 'y' | bool }}"
- template: "{{ 't' | bool }}"
- template: "{{ 'yEs' | bool }}"
- template: "{{ ' yes ' | bool }}"
# Measured against ansible-core 2.19.12: None coerces to False, with a deprecation warning that
# a future release will stop doing this. Not None, which is what an unchanged-argument reading
# of `to_bool` would predict.
- template: "{{ none | bool }}"
# Key order: a mapping written out of alphabetical order
- template: "{{ d | to_json }}"
  vars: {d: {b: 1, a: 2, c: 3}}
- template: "{{ d | to_nice_json }}"
  vars: {d: {b: 1, a: 2, c: 3}}
- template: "{{ d | dict2items }}"
  vars: {d: {b: 1, a: 2, c: 3}}
# A value that came from a managed host is data: the reference shows its text and never renders
# it. `untrusted` names are set up as a `command` the play registers and a `set_fact` built from
# that register, which is exactly how such a value arrives in a real play.
- template: "{{ reg }}"
  untrusted: {reg: "{{ 1 + 1 }}"}
# Builtin filters, tests and lookups that only ansible-core implements: Volant answers them
# through the Python helper, so these rows run in reference_modules.rs and not in reference.rs.
# The controller-fs rows read the files bridge_fs.json lists, which both sides write first.
- {bridge: true, template: "{{ 'ab' | center(6) }}"}
- {bridge: true, template: "{{ 'abc' | checksum }}"}
- {bridge: true, template: "{{ 'abc' | sha1 }}"}
- {bridge: true, template: "{{ 'abc' | md5 }}"}
- {bridge: true, template: "{{ 'abc' | hash('sha256') }}"}
