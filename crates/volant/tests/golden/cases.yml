# Each case is either a template rendered through `debug: msg=` or a `when` condition.
# Regenerate expected.json with `just golden`; never edit expected.json by hand.
- template: "{{ 1 + 1 }}"
- template: "{{ 2.5 * 2 }}"
- template: "{{ x * 2 }}"
  vars: {x: 5}
- template: "Hello {{ name }}!"
  vars: {name: World}
- template: "{{ name }} and {{ other }}"
  vars: {name: a, other: b}
- template: "{{ items | length }}"
  vars: {items: [1, 2, 3]}
- template: "{{ items[1] }}"
  vars: {items: [1, 2, 3]}
- template: "{{ conf.port }}"
  vars: {conf: {port: 8080}}
- template: "{{ conf['port'] }}"
  vars: {conf: {port: 8080}}
- template: "{{ flag }}"
  vars: {flag: true}
- template: "{{ nothing }}"
  vars: {nothing: null}
- template: "{{ items }}"
  vars: {items: [1, "two", {three: 3}]}
- template: "{{ 'lit' }}"
- template: "{% if x %}yes{% else %}no{% endif %}"
  vars: {x: 0}
- template: "{{ missing }}"
- template: "{{ conf.missing }}"
  vars: {conf: {port: 1}}
- template: "{{ 'text' | upper }}"
- template: "{{ items | join(', ') }}"
  vars: {items: [a, b]}
- template: "{{ (x > 3) | string }}"
  vars: {x: 5}
- template: "plain text without a template"
- template: "{{ x }}"
  vars: {x: "007"}
- template: "{{ x | int }}"
  vars: {x: "007"}
- when: "x > 3"
  vars: {x: 5}
- when: "x > 3"
  vars: {x: 1}
- when: "flag"
  vars: {flag: false}
- when: "x is defined"
  vars: {x: 1}
- when: "y is defined"
- when: "y is not defined"
- when: "'yes'"
- when: "x"
  vars: {x: "false"}
- when: "{{ x > 3 }}"
  vars: {x: 5}
- when: "missing > 3"
# YAML 1.1 vs 1.2 scalar resolution: PyYAML (Ansible, and generate.py itself) follows 1.1,
# saphyr follows 1.2. These are single expressions so the JSON type PyYAML resolved survives
# unchanged into expected.json's "result": reading it after `just golden` tells us what
# ansible-core treats as bool/null/int/string for each spelling, ground truth for yaml.rs.
- template: "{{ flag }}"
  vars: {flag: yes}
- template: "{{ flag }}"
  vars: {flag: Yes}
- template: "{{ flag }}"
  vars: {flag: YES}
- template: "{{ flag }}"
  vars: {flag: no}
- template: "{{ flag }}"
  vars: {flag: No}
- template: "{{ flag }}"
  vars: {flag: NO}
- template: "{{ flag }}"
  vars: {flag: on}
- template: "{{ flag }}"
  vars: {flag: On}
- template: "{{ flag }}"
  vars: {flag: ON}
- template: "{{ flag }}"
  vars: {flag: off}
- template: "{{ flag }}"
  vars: {flag: Off}
- template: "{{ flag }}"
  vars: {flag: OFF}
- template: "{{ flag }}"
  vars: {flag: "yes"}
- template: "{{ flag }}"
  vars: {flag: "no"}
- template: "{{ flag }}"
  vars: {flag: "on"}
- template: "{{ flag }}"
  vars: {flag: "off"}
- template: "{{ nothing }}"
  vars: {nothing: ~}
- template: "{{ nothing }}"
  vars: {nothing: null}
- template: "{{ nothing }}"
  vars: {nothing: Null}
- template: "{{ nothing }}"
  vars: {nothing: NULL}
- template: "{{ nothing }}"
  vars: {nothing: "null"}
- template: "{{ num }}"
  vars: {num: 010}
- template: "{{ num }}"
  vars: {num: "010"}
- template: "{{ num }}"
  vars: {num: 08}
- template: "{{ num }}"
  vars: {num: 0x10}
- template: "{{ num }}"
  vars: {num: 1_000}
- template: "{{ num }}"
  vars: {num: 1.0}
- template: "{{ v }}"
  vars: {v: "true"}
- template: "{{ v }}"
  vars: {v: "false"}
- template: "{{ v }}"
  vars: {v: True}
- template: "{{ v }}"
  vars: {v: False}
# Ansible filters
- template: "{{ missing | default('fallback') }}"
- template: "{{ empty | default('fallback') }}"
  vars: {empty: ""}
- template: "{{ empty | default('fallback', true) }}"
  vars: {empty: ""}
- template: "{{ present | default('fallback') }}"
  vars: {present: 0}
- template: "{{ 'yes' | bool }}"
- template: "{{ 'no' | bool }}"
- template: "{{ 1 | bool }}"
- template: "{{ 'on' | bool }}"
- template: "{{ 'maybe' | bool }}"
- template: "{{ '42' | int }}"
- template: "{{ 'abc' | int }}"
- template: "{{ 3.9 | int }}"
- template: "{{ '2.5' | float }}"
- template: "{{ present | mandatory }}"
  vars: {present: 1}
- template: "{{ missing | mandatory }}"
- template: "{{ (x > 3) | ternary('big', 'small') }}"
  vars: {x: 5}
- template: "{{ a | combine(b) }}"
  vars: {a: {x: 1, y: 1}, b: {y: 2, z: 2}}
- template: "{{ a | combine(b, recursive=true) }}"
  vars: {a: {n: {x: 1, y: 1}}, b: {n: {y: 2}}}
- template: "{{ d | dict2items }}"
  vars: {d: {a: 1, b: 2}}
- template: "{{ d | dict2items(key_name='k', value_name='v') }}"
  vars: {d: {a: 1}}
- template: "{{ l | items2dict }}"
  vars: {l: [{key: a, value: 1}, {key: b, value: 2}]}
- template: "{{ d | to_json }}"
  vars: {d: {b: 1, a: [1, 2]}}
- template: "{{ d | to_nice_json }}"
  vars: {d: {b: 1, a: [1, 2]}}
- template: "{{ s | from_json }}"
  vars: {s: '{"a": [1, 2]}'}
- template: "{{ '/etc/nginx/nginx.conf' | basename }}"
- template: "{{ '/etc/nginx/nginx.conf' | dirname }}"
- template: "{{ 'a,b,,c' | split(',') }}"
- template: "{{ '  a b   c ' | split }}"
- template: "{{ 'ansible' | regex_replace('^a(.*)$', 'A\\1') }}"
- template: "{{ 'foo=bar' | regex_replace('(?P<k>\\w+)=(?P<v>\\w+)', '\\g<v>=\\g<k>') }}"
- template: "{{ 'Hello World' | regex_replace('world', 'there', ignorecase=true) }}"
- template: "{{ 'server1.example.com' | regex_search('^(\\w+)\\.') }}"
- template: "{{ 'server1.example.com' | regex_search('^(\\w+)\\.', '\\1') }}"
- template: "{{ 'nothing here' | regex_search('\\d+') }}"
- template: "{{ 'a1b22c333' | regex_findall('\\d+') }}"
- template: "{{ missing_filter_input | some_unknown_filter }}"
  vars: {missing_filter_input: 1}
# Ansible tests
- when: "x is truthy"
  vars: {x: "0"}
- when: "x is falsy"
  vars: {x: []}
- when: "'foobar' is match('foo')"
- when: "'foobar' is match('bar')"
- when: "'foobar' is search('bar')"
- when: "'foobar' is regex('^f.*r$')"
- when: "'b' in items"
  vars: {items: [a, b]}
- when: "items is contains('b')"
  vars: {items: [a, b]}
# lookups
- template: "{{ lookup('env', 'VOLANT_GOLDEN_ENV') }}"
- template: "{{ lookup('env', 'VOLANT_GOLDEN_UNSET_ENV') }}"
- template: "{{ lookup('vars', 'name') }}"
  vars: {name: found}
- template: "{{ lookup('pipe', 'echo piped') }}"
- template: "{{ lookup('file', 'golden_lookup.txt') }}"
# YAML 1.1 scalar resolution: PyYAML types these `vars` before any template runs, so the
# reference type of each spelling is what expected.json records.
- template: "{{ x }}"
  vars: {x: 010}
- template: "{{ x }}"
  vars: {x: 0o10}
- template: "{{ x }}"
  vars: {x: 0b1010}
- template: "{{ x }}"
  vars: {x: 1_000}
- template: "{{ x }}"
  vars: {x: 0x1F}
- template: "{{ x }}"
  vars: {x: 1e3}
- template: "{{ x }}"
  vars: {x: +12}
- template: "{{ x }}"
  vars: {x: 0}
- template: "{{ x }}"
  vars: {x: 00}
# The `bool` filter's own spellings, which are not PyYAML's
- template: "{{ 'y' | bool }}"
- template: "{{ 't' | bool }}"
- template: "{{ 'yEs' | bool }}"
- template: "{{ ' yes ' | bool }}"
# Measured against ansible-core 2.19.12: None coerces to False, with a deprecation warning that
# a future release will stop doing this. Not None, which is what an unchanged-argument reading
# of `to_bool` would predict.
- template: "{{ none | bool }}"
# Key order: a mapping written out of alphabetical order
- template: "{{ d | to_json }}"
  vars: {d: {b: 1, a: 2, c: 3}}
- template: "{{ d | to_nice_json }}"
  vars: {d: {b: 1, a: 2, c: 3}}
- template: "{{ d | dict2items }}"
  vars: {d: {b: 1, a: 2, c: 3}}
# A value that came from a managed host is data: the reference shows its text and never renders
# it. `untrusted` names are set up as a `command` the play registers and a `set_fact` built from
# that register, which is exactly how such a value arrives in a real play.
- template: "{{ reg }}"
  untrusted: {reg: "{{ 1 + 1 }}"}
# Builtin filters, tests and lookups that only ansible-core implements: Volant answers them
# through the Python helper, so these rows run in reference_modules.rs and not in reference.rs.
# The controller-fs rows read the files bridge_fs.json lists, which both sides write first.
