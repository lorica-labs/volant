# Each case: the inventory sources, given from this directory, and the environment
# `ansible-inventory --list` reads them with. Recorded into ../expected_inventory.json.
# `hosts: unordered` leaves the `--list-hosts` order unrecorded, where the reference's walk of
# sibling groups is hashed by name and differs from one run to the next.
# `needs: [ansible-core]` marks a case that runs a collection plugin, which Volant runs in ansible-core.
ranges: {sources: [ranges.ini]}
host_list: {sources: ["a:2222,,b,[::1]:22,b:x,"]}
directory: {sources: [dir]}
