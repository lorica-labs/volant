# Fixture for the inventory golden: hosts, groups, children, and vars. The host/group homonym is
# deliberately kept out of this shared fixture (see homonym_inventory.ini): Ansible warns about a
# homonym once at inventory *load* time, so a single homonym anywhere here would make every one of
# the patterns below warn regardless of what it names, leaving the golden's "warning" field unable
# to tell a correct implementation from one that warns unconditionally.
lonely ansible_connection=local

[web]
web1 ansible_host=10.0.0.1 port=8081 leading=010 grouped=1_000 word=yes flag=True quoted='a b'
web2
web3

[db]
db1
db2

[web:vars]
tier=web
http_port=80

[prod:children]
web
db

[prod:vars]
env=prod

[same]
solo

[shared:children]
web
