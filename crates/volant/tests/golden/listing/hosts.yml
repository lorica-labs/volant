# Three shapes of `hosts`, each resolving to one host or to none. Not two: the reference prints
# a play's hosts out of a Python set, so a play matching more than one lists them in an order
# that changes between processes and nothing can be compared with it.
- name: one host by name
  hosts: h1
  gather_facts: false
  tasks:
    - name: t
      debug: msg=t
- name: one host through a group
  hosts: web
  gather_facts: false
  tasks:
    - name: t
      debug: msg=t
- name: a pattern nothing matches
  hosts: nosuchgroup
  gather_facts: false
  tasks:
    - name: t
      debug: msg=t
