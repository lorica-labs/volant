# The YAML files `just yaml-corpus` loads with Volant and with ansible-core, each source pinned.
# Fields: name, git (the repository), ref (a commit or a tag), paths (the directories of the
# checkout whose `.yml` and `.yaml` files are read; the whole checkout when left out).
# The ansible package pinned in ANSIBLE_PACKAGE is read too, every file of its collections.
- name: ansible-core
  git: https://github.com/ansible/ansible
  ref: v2.19.12
  paths: [test]
- name: kubespray
  git: https://github.com/kubernetes-sigs/kubespray
  ref: c219d80df9bae65db1334805dfb55733df4d2e01
- name: debops
  git: https://github.com/debops/debops
  ref: c7b0813f448fd9a1c0d8a0ee9b2a5d1e170bba28
- name: ceph-ansible
  git: https://github.com/ceph/ceph-ansible
  ref: 2111ba43ce0ca98558416067e6505217d800ff8d
- name: openstack-ansible
  git: https://github.com/openstack/openstack-ansible
  ref: 48456a06dff6b9cda3089530866ae0a7a67af8aa
- name: rhel9-cis
  git: https://github.com/ansible-lockdown/RHEL9-CIS
  ref: 643c592bb7c03562edffa006d762516a80783ec8
- name: algo
  git: https://github.com/trailofbits/algo
  ref: b1444878b67c8bc238a4f344edf9878619deddc6
- name: geerlingguy-docker
  git: https://github.com/geerlingguy/ansible-role-docker
