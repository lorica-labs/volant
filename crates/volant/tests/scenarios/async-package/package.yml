- hosts: h1
  gather_facts: false
  vars:
    ansible_async_dir: "{{ playbook_dir }}/jobs"
  tasks:
    - name: a polled package start
      package:
        name: bash
        state: present
      async: 30
      poll: 1
      register: polled

    - debug:
        msg: "{{ polled | list | sort }}"

    - name: an unpolled package start
      package:
        name: bash
        state: present
      async: 30
      poll: 0
      register: started

    - debug:
        msg: "{{ started | list | sort }}"

    - name: read back
      async_status:
        jid: "{{ started.ansible_job_id }}"
      register: back
      until: back.finished
      retries: 30
      delay: 1

    - debug:
        msg: "{{ back | list | sort }}"
