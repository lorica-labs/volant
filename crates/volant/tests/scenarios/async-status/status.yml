- hosts: h1
  gather_facts: false
  vars:
    ansible_async_dir: "{{ playbook_dir }}/jobs"
  tasks:
    - name: fire
      command: sleep 8
      async: 30
      poll: 0
      register: r

    - debug: var=r

    - name: the first status, as the job writes it
      command: cat {{ r.results_file }}
      register: initial

    - debug: var=initial.stdout

    - name: still running
      async_status:
        jid: "{{ r.ansible_job_id }}"
      register: early

    - debug: var=early

    - pause: seconds=12

    - name: finished
      async_status:
        jid: "{{ r.ansible_job_id }}"
      register: s
      until: s.finished
      retries: 20
      delay: 1

    - debug: var=s

    - name: clean up
      async_status:
        jid: "{{ r.ansible_job_id }}"
        mode: cleanup
      register: c

    - debug: var=c

    - name: the status file is gone
      shell: test -e {{ r.results_file }} && echo kept || echo removed
      register: kept

    - debug: var=kept.stdout

    - name: a job nobody started
      async_status: jid=nosuch.1
      register: missing
      ignore_errors: true

    - debug: var=missing

    - name: a status file cut short
      shell: |
        printf '{"rc": 0, "chan' > '{{ playbook_dir }}/jobs/j1.2'

    - name: reads as a job still running
      async_status: jid=j1.2
      register: cut

    - debug: var=cut

    - name: a failing job
      command: "false"
      async: 30
      poll: 0
      register: g

    - pause: seconds=3

    - async_status: jid={{ g.ansible_job_id }}
      register: gs
      ignore_errors: true

    - debug: var=gs.rc

    # Killed at two seconds and its status written at three.
    - name: a job past its limit
      command: sleep 30
      async: 2
      poll: 0
      register: late

    - pause: seconds=6

    - async_status: jid={{ late.ansible_job_id }}
      register: qs
      ignore_errors: true

    - debug: var=qs
