- hosts: h1
  gather_facts: false
  vars:
    out: /tmp/volant-shim-gaps-{{ playbook_dir | basename }}
  tasks:
    - file: {path: "{{ out }}", state: absent}
      diff: false
    - name: A directory
      copy: {src: tree, dest: "{{ out }}"}
    - name: Again
      copy: {src: tree, dest: "{{ out }}"}
    - name: Assemble
      assemble: {src: parts, dest: "{{ out }}/all", remote_src: false}
    - name: Assemble as root
      assemble: {src: parts, dest: "{{ out }}/all2", remote_src: false}
      become: true
    - name: Read it
      command: cat {{ out }}/all {{ out }}/tree/b.txt
      register: r
      changed_when: false
    - debug: var=r.stdout_lines
    - name: Parallel facts
      gather_facts: {parallel: true}
    - debug: msg="{{ ansible_facts.system is defined }}"
    - file: {path: "{{ out }}", state: absent}
      diff: false
