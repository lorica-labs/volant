- hosts: localhost
  gather_facts: false
  vars:
    csv_text: |
      a,b
      1,2
    ini_text: |
      [s]
      k=v
    app_a_list: [1]
    app_b_list: [2]
  tasks:
    - name: accumulate
      debug:
        msg: "{{ [1, 2, 3] | community.general.accumulate }}"
      ignore_errors: true
    - name: counter
      debug:
        msg: "{{ ['a', 'b', 'a'] | community.general.counter }}"
      ignore_errors: true
    - name: crc32
      debug:
        msg: "{{ 'abc' | community.general.crc32 }}"
      ignore_errors: true
    - name: dict
      debug:
        msg: "{{ [['a', 1], ['b', 2]] | community.general.dict }}"
      ignore_errors: true
    - name: dict_kv
      debug:
        msg: "{{ 'v' | community.general.dict_kv('k') }}"
      ignore_errors: true
    - name: from_csv
      debug:
        msg: "{{ csv_text | community.general.from_csv }}"
      ignore_errors: true
    - name: from_ini
      debug:
        msg: "{{ ini_text | community.general.from_ini }}"
      ignore_errors: true
    - name: from_toml
      debug:
        msg: "{{ 'a = 1' | community.general.from_toml }}"
      ignore_errors: true
    - name: groupby_as_dict
      debug:
        msg: "{{ [{'n': 'a', 'v': 1}, {'n': 'b', 'v': 2}] | community.general.groupby_as_dict('n') }}"
      ignore_errors: true
    - name: json_query
      debug:
        msg: "{{ {'a': [{'b': 1}, {'b': 2}]} | community.general.json_query('a[*].b') }}"
      ignore_errors: true
    - name: keep_keys
      debug:
        msg: "{{ [{'a': 1, 'b': 2}] | community.general.keep_keys(target=['a']) }}"
      ignore_errors: true
    - name: remove_keys
      debug:
        msg: "{{ [{'a': 1, 'b': 2}] | community.general.remove_keys(target=['a']) }}"
      ignore_errors: true
    - name: replace_keys
      debug:
        msg: "{{ [{'a': 1, 'b': 2}] | community.general.replace_keys(target=[{'before': 'a', 'after': 'z'}]) }}"
      ignore_errors: true
    - name: lists_union
      debug:
        msg: "{{ [1, 2] | community.general.lists_union([2, 3]) }}"
      ignore_errors: true
    - name: lists_intersect
      debug:
        msg: "{{ [1, 2] | community.general.lists_intersect([2, 3]) }}"
      ignore_errors: true
    - name: lists_difference
      debug:
        msg: "{{ [1, 2] | community.general.lists_difference([2, 3]) }}"
      ignore_errors: true
    - name: lists_symmetric_difference
      debug:
        msg: "{{ [1, 2] | community.general.lists_symmetric_difference([2, 3]) }}"
      ignore_errors: true
    - name: lists_mergeby
      debug:
        msg: "{{ [{'n': 'a', 'x': 1}] | community.general.lists_mergeby([{'n': 'a', 'y': 2}], 'n') }}"
      ignore_errors: true
    - name: random_mac
      debug:
        msg: "{{ '00:11:22' | community.general.random_mac(seed='volant') }}"
      ignore_errors: true
    - name: reveal_ansible_type
      debug:
        msg: "{{ [1, 2] | community.general.reveal_ansible_type }}"
      ignore_errors: true
    - name: to_seconds
      debug:
        msg: "{{ '1m 30s' | community.general.to_seconds }}"
      ignore_errors: true
    - name: to_milliseconds
      debug:
        msg: "{{ '1s' | community.general.to_milliseconds }}"
      ignore_errors: true
    - name: to_minutes
      debug:
        msg: "{{ '2h' | community.general.to_minutes }}"
      ignore_errors: true
    - name: to_hours
      debug:
        msg: "{{ '1d' | community.general.to_hours }}"
      ignore_errors: true
    - name: to_days
      debug:
        msg: "{{ '1w' | community.general.to_days }}"
      ignore_errors: true
    - name: to_weeks
      debug:
        msg: "{{ '14d' | community.general.to_weeks }}"
      ignore_errors: true
    - name: to_months
      debug:
        msg: "{{ '2y' | community.general.to_months }}"
      ignore_errors: true
    - name: to_years
      debug:
        msg: "{{ '24mo' | community.general.to_years }}"
      ignore_errors: true
    - name: to_time_unit
      debug:
        msg: "{{ '1h' | community.general.to_time_unit('seconds') }}"
      ignore_errors: true
    - name: to_ini
      debug:
        msg: "{{ {'s': {'k': 'v'}} | community.general.to_ini }}"
      ignore_errors: true
    - name: to_yaml
      debug:
        msg: "{{ {'a': [1, 2]} | community.general.to_yaml }}"
      ignore_errors: true
    - name: to_nice_yaml
      debug:
        msg: "{{ {'a': [1, 2]} | community.general.to_nice_yaml }}"
      ignore_errors: true
    - name: unicode_normalize
      debug:
        msg: "{{ 'abc' | community.general.unicode_normalize('NFC') | length }}"
      ignore_errors: true
    - name: version_sort
      debug:
        msg: "{{ ['1.10', '1.2', '1.9'] | community.general.version_sort }}"
      ignore_errors: true
    - name: is a_module
      debug:
        msg: "{{ 'ansible.builtin.copy' is community.general.a_module }}"
      ignore_errors: true
    - name: is ansible_type
      debug:
        msg: "{{ [1, 2] is community.general.ansible_type('list') }}"
      ignore_errors: true
    - name: lookup binary_file
      debug:
        msg: "{{ lookup('community.general.binary_file', playbook_dir ~ '/data.txt') }}"
      ignore_errors: true
    - name: lookup cartesian
      debug:
        msg: "{{ lookup('community.general.cartesian', [1, 2], ['a', 'b'], wantlist=True) }}"
      ignore_errors: true
    - name: lookup collection_version
      debug:
        msg: "{{ lookup('community.general.collection_version', 'community.general') }}"
      ignore_errors: true
    - name: lookup dependent
      debug:
        msg: "{{ lookup('community.general.dependent', {'a': [1, 2]}, wantlist=True) }}"
      ignore_errors: true
    - name: lookup filetree
      debug:
        msg: "{{ lookup('community.general.filetree', playbook_dir ~ '/tree', wantlist=True) | map(attribute='path') | list }}"
      ignore_errors: true
    - name: lookup flattened
      debug:
        msg: "{{ lookup('community.general.flattened', [1, [2, [3]]], wantlist=True) }}"
      ignore_errors: true
    - name: lookup merge_variables
      debug:
        msg: "{{ lookup('community.general.merge_variables', '^app_.*_list$') }}"
      ignore_errors: true
    - name: lookup random_string
      debug:
        msg: "{{ lookup('community.general.random_string', length=8) | length }}"
      ignore_errors: true
