- hosts: h1
  gather_facts: false
  tasks:
    - name: free form
      command: nosuch-program
      register: free
      ignore_errors: true
    - debug:
        var: free
    - name: a list
      command:
        argv: [nosuch-program, one, two words]
      register: listed
      ignore_errors: true
    - debug:
        var: listed
    - name: quoted words
      command: nosuch-program -a "b c" --password=secret
      register: quoted
      ignore_errors: true
    - debug:
        var: quoted
    - name: a directory is not a program
      command: /
      register: dir
      ignore_errors: true
    - debug:
        msg: "{{ dir.rc }} {{ dir.cmd }}"
    - name: credentials in a URL are masked
      command: nosuch-program https://user:s3cret@host/x user:pw@host:path
      register: url
      ignore_errors: true
    - debug:
        var: url.cmd
    - name: a shell whose executable cannot start
      shell: echo https://user:s3cret@host/x
      args:
        executable: /nonexistent/sh
      register: lined
      ignore_errors: true
    - debug:
        var: lined
