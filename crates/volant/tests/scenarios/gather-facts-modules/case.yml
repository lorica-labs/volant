# gather_facts runs the fact modules ansible_facts_modules names besides setup, serially or in
# parallel, merges their facts, and reports a failed one as the reference's plugin does.
needs: [ansible-core]
runs:
  - args: [-i, inv.ini, serial.yml]
  - args: [-i, inv.ini, parallel.yml]
  - args: [-i, inv.ini, failed.yml]
