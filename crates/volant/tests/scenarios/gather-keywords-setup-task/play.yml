- hosts: h1
  gather_facts: false
  tasks:
    - setup: {gather_subset: "!all,!min,local", fact_path: "{{ playbook_dir }}/facts"}
    - debug: var=ansible_local
    - setup: {gather_subset: min, fact_path: /nonexistent}
    - debug: var=ansible_local
    - setup: {gather_subset: min, gather_timeout: abc}
      ignore_errors: true
    - setup: {gather_subset: min, gather_timeout: 0}
    - setup: {gather_subset: ["!all", "!min", "env"]}
      register: r
    - debug: msg="{{ r.ansible_facts.keys() | sort | list }}"
