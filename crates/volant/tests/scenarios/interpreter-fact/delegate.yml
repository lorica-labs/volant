- hosts: h1
  gather_facts: false
  tasks:
    - debug:
        msg: "start: {{ discovered_interpreter_python is defined }}"
    - command: "true"
      delegate_to: h2
      register: plain
    - debug:
        msg: "plain: {{ plain.ansible_facts is defined }} {{ plain.warnings | default([]) | length }} {{ discovered_interpreter_python is defined }} {{ hostvars.h2.discovered_interpreter_python is defined }}"
    - command: "true"
      delegate_to: h2
      delegate_facts: true
      register: kept
    - debug:
        msg: "kept: {{ kept.ansible_facts is defined }} {{ kept.warnings | default([]) | length }} {{ discovered_interpreter_python is defined }} {{ hostvars.h2.discovered_interpreter_python is defined }}"
