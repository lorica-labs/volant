- hosts: all
  gather_facts: false
  tasks:
    - debug: msg="{{ groups.all }}"
      run_once: true
    - shell: echo "h5 ansible_connection=local ansible_python_interpreter=/usr/bin/python3" >> {{ playbook_dir }}/inv.ini
      delegate_to: localhost
      run_once: true
    - meta: refresh_inventory
    - debug: msg="{{ groups.all }}"
      run_once: true
    - debug: msg=still
- hosts: all
  gather_facts: false
  tasks:
    - debug: msg=play2
