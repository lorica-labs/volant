- hosts: all
  gather_facts: false
  tasks:
    - set_fact: {sf: kept}
    - add_host: {name: dyn, groups: [g_dyn], ansible_connection: local}
      run_once: true
    - shell: printf '[g]\nh1 ansible_connection=local ansible_python_interpreter=/usr/bin/python3 w=two\nh3 ansible_connection=local ansible_python_interpreter=/usr/bin/python3 w=two\n\n[h2]\nh1\n' > {{ playbook_dir }}/inv.ini
      delegate_to: localhost
      run_once: true
    - meta: refresh_inventory
    - debug: msg="{{ inventory_hostname }} w={{ w | default('-') }} sf={{ sf | default('LOST') }} gx={{ gx | default('-') }}"
    - debug: msg="all={{ groups.all | sort }} dyn={{ groups.g_dyn | default('NOGROUP') }} play={{ ansible_play_hosts_all }}"
      run_once: true
- hosts: all
  gather_facts: false
  tasks:
    - debug: msg="PLAY2 {{ inventory_hostname }} w={{ w | default('-') }} sf={{ sf | default('LOST') }}"
- hosts: g_dyn
  gather_facts: false
  tasks:
    - debug: msg="PLAY3 {{ inventory_hostname }}"
