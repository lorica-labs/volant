# `result_format = yaml` with `pretty_results` off: two-space nesting, the `_lines` kept and the
# text blocks as they are.
needs: [ansible-core]
env: {"ANSIBLE_CALLBACK_RESULT_FORMAT": "yaml", "ANSIBLE_CALLBACK_FORMAT_PRETTY": "false"}
runs:
  - args: [-i, inv.ini, results.yml]
  - args: [-v, -i, inv.ini, results.yml]
