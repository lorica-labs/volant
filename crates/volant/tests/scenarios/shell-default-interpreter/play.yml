- hosts: all
  gather_facts: false
  tasks:
    - shell: echo $0
      register: by_shell
    - raw: echo $0
      register: by_raw
    - debug:
        msg: "{{ by_shell.stdout }} {{ by_raw.stdout | trim }}"
    - shell: nosuchcmd
      ignore_errors: true
    - raw: nosuchcmd
      ignore_errors: true
