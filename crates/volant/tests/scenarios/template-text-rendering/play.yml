- hosts: h1
  gather_facts: false
  vars:
    l: [a, b]
    n: null
    d: {k: 1, s: x}
    nl: x
    five: 5
  tasks:
    - debug:
        msg: "list={{ l }} dict={{ d }} none=[{{ n }}] nested={{ [l, n, d] }}"
    - debug:
        msg: "{{ n }}"
    - debug:
        msg: 'a{{ true }}b{{ 1.5 }}c{{ none }}'
    - debug:
        msg: '{{ undefined_var.attr | default("dflt") }}'
    - debug:
        msg: '{{ undefined_var.a.b | default("deep") }}'
    - debug:
        msg: '{{ d.nokey.sub | default("dk") }}'
    - debug:
        msg: '{{ d["nokey"]["sub"] is defined }}'
    - debug:
        msg: "{{ nl }}\n"
    - copy:
        content: "{{ nl }}\n"
        dest: "{{ playbook_dir }}/out.txt"
      register: out
    - debug:
        msg: "{{ out.size }}"
    - debug:
        msg: "{{ five }} "
    - debug:
        msg: " {{ five }}"
