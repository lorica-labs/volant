- hosts: h1
  gather_facts: false
  tasks:
    - name: Read a file whose text is a bare expression
      command: cat {{ payload }}
      register: r
    - name: Name the variable to show from the result
      debug:
        var: "{{ r.stdout }}"
      ignore_errors: true
    - name: Name it from a loop item
      debug:
        var: "{{ item }}"
      loop: "{{ r.stdout_lines }}"
      ignore_errors: true

- hosts: h1
  gather_facts: false
  tasks:
    - name: Look for the marker the expression would leave
      command: test -e marker
      register: marker
      failed_when: false
    - name: Whether the marker exists
      debug:
        msg: "{{ 'present' if marker.rc == 0 else 'absent' }}"
