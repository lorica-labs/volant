- hosts: all
  gather_facts: false
  tasks:
    - name: One host records the payload
      command: cat {{ payload }}
      register: r
      when: inventory_hostname == 'h1'
    - name: The other reads it across hosts
      debug:
        msg: "{{ hostvars['h1'].r.stdout }}"
      when: inventory_hostname == 'h2'

- name: Whether the payload ran
  hosts: h1
  gather_facts: false
  tasks:
    - name: Look for the marker the payload would have written
      shell: "test -e {{ playbook_dir }}/marker && echo ran || echo never ran"
      register: marker
    - name: The payload never ran
      debug:
        var: marker.stdout
