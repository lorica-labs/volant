- hosts: h1
  gather_facts: false
  tasks:
    - name: Read a file whose text looks like a template
      command: cat {{ payload }}
      register: motd
    - name: Hand it down to an included file
      include_tasks: include-shows-param.yml
      vars:
        banner: "{{ motd.stdout }}"

- name: Whether the payload ran
  hosts: h1
  gather_facts: false
  tasks:
    - name: Look for the marker the payload would have written
      shell: "test -e {{ playbook_dir }}/marker && echo ran || echo never ran"
      register: marker
    - name: The payload never ran
      debug:
        var: marker.stdout
