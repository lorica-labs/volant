# The names of the inventory are text in every read: through variables, by loop and by a lookup.
- hosts: h1
  gather_facts: false
  vars:
    from_groups: "{{ groups | list | sort }}"
    from_hostvars: "{{ hostvars | list | sort }}"
    from_group_names: "{{ group_names | sort }}"
    one_group: "{{ groups['all'] | sort }}"
  tasks:
    - debug:
        msg: "{{ from_groups }} {{ from_hostvars }} {{ from_group_names }}"
    - debug:
        var: one_group
    - debug:
        msg: "{{ item }}"
      loop: "{{ groups | list | sort }}"
    - debug:
        msg: "{{ lookup('inventory_hostnames', 'all') }}"
