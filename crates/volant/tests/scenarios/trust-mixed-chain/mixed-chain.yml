- hosts: h1
  gather_facts: false
  vars:
    greeting: "greet {{ item }}"
  tasks:
    - name: Read a file whose text looks like a template
      command: cat {{ payload }}
      register: motd
    - name: An author variable and a result in the same map
      debug:
        msg: "{{ greeting }} and {{ carried }}"
      vars:
        carried: "{{ motd.stdout }}"
      loop:
        - a

- name: Whether the payload ran
  hosts: h1
  gather_facts: false
  tasks:
    - name: Look for the marker the payload would have written
      shell: "test -e {{ playbook_dir }}/marker && echo ran || echo never ran"
      register: marker
    - name: The payload never ran
      debug:
        var: marker.stdout
