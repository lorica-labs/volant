[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
  "GPL-3.0-or-later",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
# The console's line editor reaches the Windows clipboard through these two, under the Boost
# licence (OSI approved, compatible with the GPL). Allowed for them alone.
exceptions = [
  { allow = [
    "BSL-1.0",
  ], crate = "clipboard-win" },
  { allow = [
    "BSL-1.0",
  ], crate = "error-code" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
