[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-musl",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to enable GitHub Attestations
github-attestations = true
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# Whether to install an updater program
install-updater = false
# Every controller archive carries both Linux musl agents, so what a user downloads can run a
# task without a second download. dist builds one target per job and none of the three other
# jobs can link a musl binary, so the agents go in afterwards: see bundle-agents.yml, which
# repacks the archives, rewrites the digests that name them and attests what it uploaded.
post-announce-jobs = ["./bundle-agents"]

# NOTE: .github/workflows/release.yml is generated by dist, but its `host` job carries one hand
# edit: GH_TOKEN there is RELEASE_PLZ_TOKEN, not GITHUB_TOKEN. The Actions token is minted with
# `Contents: write` and still gets HTTP 403 from the releases API on this repository, with the
# repository and organisation workflow permissions both set to write and the tag ruleset proven
# not to be the cause. bundle-agents.yml carries the same change for the same reason. Re-running
# `dist init` or `dist generate` reverts the release.yml half; put it back.

[dist.github-custom-job-permissions.bundle-agents]
attestations = "write"
contents = "write"
id-token = "write"
