[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-musl",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to enable GitHub Attestations
github-attestations = true
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# Whether to install an updater program
install-updater = false
# The `Create GitHub Release` step in the generated workflow is hand edited, so dist is told not
# to check it back against what it would generate. The edit and its reason are in the note
# below; `dist init` still rewrites the file, and this only stops `dist plan` failing every pull
# request in the meantime.
allow-dirty = ["ci"]
# Every build job first builds the agents the controller embeds for its target (the local one and
# both Linux musl ones, see crates/volant/build.rs) and names their directory in
# VOLANT_EMBED_AGENTS_DIR, so each controller dist builds carries its agents and needs nothing
# installed beside it. dist builds one target per job and the macOS jobs cannot link musl with
# the system toolchain, so the musl agents are built with cargo-zigbuild. The archives hold only
# the controller; the agents are also published in their own volant-agent-* archives.
github-build-setup = "../build-setup.yml"

# NOTE: .github/workflows/release.yml is generated by dist, and its `Create GitHub Release`
# step carries one hand edit: it drops `--target`. Immutable releases are enabled for this
# repository, the tag already exists by the time the step runs, and setting a target commit on
# an existing tag is refused, which is what made every release from 0.1.0-alpha.6 onward fail
# with an HTTP 403 that reads like a permissions problem and is not one. Re-running `dist init`
# or `dist generate` reverts it; put it back.
#
# An immutable release locks its assets when it is published. The step no longer passes
# `--draft`, which existed only so a later job could repack the archives before publishing:
# every asset is final when the step runs, and `gh release create` given files creates the
# release as a draft, uploads them, and publishes it only once they are all there.

# Homebrew is not enabled yet. It takes: "homebrew" added to `installers`, `tap =
# "lorica-labs/homebrew-tap"` (the repository must exist), `publish-jobs = ["homebrew"]`, and a
# HOMEBREW_TAP_TOKEN repository secret that can push to the tap. Then run `dist generate` and put
# the hand edit above back.
