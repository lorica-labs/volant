[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-musl",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to enable GitHub Attestations
github-attestations = true
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# Whether to install an updater program
install-updater = false
# Every controller archive carries both Linux musl agents, so what a user downloads can run a
# task without a second download. dist builds one target per job and none of the three other
# jobs can link a musl binary, so the agents go in afterwards: see bundle-agents.yml, which
# repacks the archives, rewrites the digests that name them and attests what it uploaded.
post-announce-jobs = ["./bundle-agents"]

[dist.github-custom-job-permissions.bundle-agents]
attestations = "write"
contents = "write"
id-token = "write"
