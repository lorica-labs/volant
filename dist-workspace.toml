[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-musl",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to enable GitHub Attestations
github-attestations = true
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# Whether to install an updater program
install-updater = false
# The `Create GitHub Release` step in the generated workflow is hand edited, so dist is told not
# to check it back against what it would generate. The edits and their reason are in the note
# below; `dist init` still rewrites the file, and this only stops `dist plan` failing every pull
# request in the meantime.
allow-dirty = ["ci"]
# Every controller archive carries both Linux musl agents, so what a user downloads can run a
# task without a second download. dist builds one target per job and none of the three other
# jobs can link a musl binary, so the agents go in afterwards: see bundle-agents.yml, which
# repacks the archives, rewrites the digests that name them and attests what it uploaded.
post-announce-jobs = ["./bundle-agents"]

# NOTE: .github/workflows/release.yml is generated by dist, and its `Create GitHub Release`
# step carries two hand edits. Immutable releases are enabled for this repository, and that
# changes two things dist does not know about. It drops `--target`: the tag already exists by
# the time the step runs, and setting a target commit on an existing tag is refused, which is
# what made every release from 0.1.0-alpha.6 onward fail with an HTTP 403 that reads like a
# permissions problem and is not one. It adds `--draft`: an immutable release locks its assets
# when it is published, so the archives must be final first, and bundle-agents publishes the
# release once it has repacked them. Re-running `dist init` or `dist generate` reverts both;
# put them back.

[dist.github-custom-job-permissions.bundle-agents]
attestations = "write"
contents = "write"
id-token = "write"
