[workspace]
changelog_update = true
dependencies_update = false
git_release_enable = false
git_tag_enable = true
pr_labels = ["release"]
semver_check = false

[[package]]
name = "volant"
git_tag_name = "v{{ version }}"
version_group = "volant"
# The repository changelog is this package's changelog. cargo-dist reads it for the release notes,
# so a hand-maintained file left everything under Unreleased and every release republished it.
changelog_path = "CHANGELOG.md"

[[package]]
name = "volant-agent"
git_tag_enable = false
version_group = "volant"

[[package]]
name = "volant-protocol"
git_tag_enable = false
changelog_update = false
version_group = "volant"
