[files]
extend-exclude = [
  "CHANGELOG.md",
  "Cargo.lock",
  "target/",
  "docs/node_modules/",
  "docs/dist/",
  "docs/package-lock.json",
  "crates/volant/tests/golden/module/",
  # The reference's plugin names: `just parity-reference` and `just docs-parity` write them.
  "crates/volant/tests/parity/reference.json",
  "crates/volant/src/later_actions.txt",
  # The filler words of `lipsum`, which are Latin.
  "crates/volant/src/template/lipsum_words.txt",
  "docs/src/content/docs/docs/reference/parity.md",
  # The translations of the documentation and the site: typos checks English only.
  "docs/src/content/docs/fr/",
  "docs/src/content/docs/de/",
  "docs/src/content/docs/es/",
  "docs/src/content/docs/zh-cn/",
  "docs/src/i18n/ui/fr.ts",
  "docs/src/i18n/ui/de.ts",
  "docs/src/i18n/ui/es.ts",
  "docs/src/i18n/ui/zh-cn.ts",
  "docs/src/i18n/sidebar.ts",
  "docs/src/products.ts",
]

[default.extend-words]
# The `flate2` crate, named in decision record 0012.
flate = "flate"
# Keys of the reference's `stat` result, which the native `stat` returns under the same names.
woth = "woth"
writeable = "writeable"
# Norwegian for "password", one of the `su` prompts the reference matches.
passord = "passord"
# Puppet's fact tool, whose prefix ansible-core's `setup` filter treats apart.
facter = "facter"
