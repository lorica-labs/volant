[files]
extend-exclude = [
  "CHANGELOG.md",
  "Cargo.lock",
  "target/",
  "docs/node_modules/",
  "docs/dist/",
  "docs/package-lock.json",
  "crates/volant/tests/golden/module/",
  # The reference's plugin names: `just parity-reference` and `just docs-parity` write them.
  "crates/volant/tests/parity/reference.json",
  "docs/src/content/docs/reference/parity.md",
]

[default.extend-words]
# Keys of the reference's `stat` result, which the native `stat` returns under the same names.
woth = "woth"
writeable = "writeable"
# Puppet's fact tool, whose prefix ansible-core's `setup` filter treats apart.
facter = "facter"
