[files]
extend-exclude = [
  "CHANGELOG.md",
  "Cargo.lock",
  "target/",
  "docs/node_modules/",
  "docs/dist/",
  "docs/package-lock.json",
  "crates/volant/tests/golden/python-modules/",
  "crates/volant/tests/golden/native/",
  # The reference's plugin names, written by `just parity-reference`.
  "crates/volant/tests/parity/reference.json",
]

[default.extend-words]
# Keys of the reference's `stat` result, which the native `stat` returns under the same names.
woth = "woth"
writeable = "writeable"
# Puppet's fact tool, whose prefix ansible-core's `setup` filter treats apart.
facter = "facter"
